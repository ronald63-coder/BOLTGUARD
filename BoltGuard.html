<html lang="en"><head><meta charset="utf-8">

<style>

:root[data-theme="light"]{--bg:#eef3f9;--side:#fff;--card:#fff;--line:#d5deea;--ink:#0d1b2e;--mute:#566b83;--acc:#1769d1;--ok:#0f9d5a;--warn:#c97a00;--bad:#d93a3a;--car:#c9d8ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--side)}
.logo{display:flex;gap:10px;align-items:center}.logo b{font-size:22px;letter-spacing:.5px;display:block;line-height:1}.logo span{font-size:12px;color:var(--mute)}
.hr{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mute)}
.pill{padding:4px 12px;border-radius:99px;background:#19d57f22;color:var(--ok);font-weight:600;font-size:12px}
.wrap{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 60px)}
nav{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px}

.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;min-width:0}
.mute{color:var(--mute)}.sm{font-size:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.e2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.k{display:flex;gap:12px;align-items:center}.k .i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--line)}
.k b,.t b{font-size:26px;font-weight:600;display:block;line-height:1.1}.t{border-left:3px solid var(--line);padding-left:10px}.t b{font-size:20px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--mute)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.d.ok{background:var(--ok)}.d.warn{background:var(--warn)}.d.bad{background:var(--bad)}

.tag.ok{background:#19d57f22}.tag.warn{background:#ffa92722}.tag.bad{background:#ff4d4d22}
canvas{width:100%;display:block}
select,input,button.b{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.z{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}.z.warn{border-color:var(--warn);background:#ffa92714}.z.ok{border-color:#19d57f55}.z.bad{border-color:var(--bad);background:#ff4d4d14}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:500}
tr[data-a]{cursor:pointer}tr.sel td{background:#2a8cff1c}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.ev:last-child{border:0}
.car{width:100%;max-width:210px;display:block;margin:auto}.car text{fill:var(--ink);font-size:11px;font-weight:600}.car .mute{fill:var(--mute);font-size:8px;font-weight:400}
.sp{display:flex;align-items:flex-end;gap:4px;height:80px}.sp i{flex:1;background:var(--acc);border-radius:2px 2px 0 0}
.al{border-left:4px solid var(--mute);padding-left:12px;margin-bottom:12px}.al.warn{border-color:var(--warn)}.al.bad{border-color:var(--bad)}.al.ok{border-color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 14px;margin:6px 0 8px}.kv span{display:block;font-size:12px;color:var(--mute)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.flow>div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.ex{background:var(--bg);border-left:3px solid var(--warn);padding:10px 12px;border-radius:4px;font-size:15px}
.tg{display:flex;gap:8px;flex-wrap:wrap}.tg button.on{background:var(--acc);border-color:var(--acc);color:#fff}

#c3d{touch-action:none;cursor:grab}main{transition:padding .4s}
#sl{position:fixed;left:208px;top:70px;bottom:14px;width:330px;overflow-y:auto;z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:10px}
.sp3{flex:none;pointer-events:auto;position:relative;background:var(--card);border:1px solid var(--acc);border-left-width:4px;border-radius:6px;padding:12px 14px;box-shadow:0 0 22px #2a8cff33;backdrop-filter:blur(8px);transform:translateX(calc(-100% - 230px));opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.sp3.in{transform:none;opacity:1}
.sp3:before,.sp3:after{content:"";position:absolute;right:-1px;width:12px;height:12px;border:2px solid var(--acc)}
.sp3:before{top:-1px;border-left:0;border-bottom:0}.sp3:after{bottom:-1px;border-left:0;border-top:0}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px;letter-spacing:.5px}.ph .b{margin-left:auto;padding:2px 8px}
.big{font-size:44px;font-weight:700;line-height:1}.fi{padding:6px 0;border-bottom:1px solid var(--line)}
.rk{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:12px}.rk div{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.rk i{display:block;height:100%}.rk i.ok{background:var(--ok)}.rk i.warn{background:var(--warn)}.rk i.bad{background:var(--bad)}
#jv{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at center,#06182e,#02060d);opacity:0;pointer-events:none;transition:opacity .4s}#jv.on{opacity:1;pointer-events:auto}
#jc{position:absolute;inset:0;width:100%;height:100%}
#jlog,#jr{position:absolute;font-size:12px;line-height:1.6;color:#7fd8ff}#jlog{left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:46vw}#jr{right:20px;top:calc(20px + env(safe-area-inset-top,0px));text-align:right}#jr b{color:#fff}
#jx{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:901px){body.pan main{padding-left:362px}}
@media (max-width:900px){#sl{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:50vh}.sp3{transform:translateX(-120%)}body.pan main{padding-bottom:52vh}}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto;white-space:nowrap}nav small{display:none}.g4,.g2,.e2,.g3{grid-template-columns:1fr 1fr}.g2,.e2{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}.hr .dt{display:none}}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr}}
</style></head>

<header>
 <div class="logo"><svg width="34" height="38" viewBox="0 0 34 38"><path d="M17 2L31 7V19C31 28 25 33 17 36C9 33 3 28 3 19V7Z" fill="none" stroke="var(--acc)" stroke-width="3"/><path d="M12 22L17 10L22 22Z" fill="var(--acc)"/></svg><div><b>BOLTGUARD</b><span>Structural Fastener Intelligence</span></div></div>

<script>
const $=s=>document.querySelector(s),f=(v,d=1)=>(+v).toFixed(d),mean=a=>a.reduce((x,y)=>x+y,0)/a.length,cl=(v,a,b)=>Math.max(a,Math.min(b,v));

const st=v=>v>=TH.c?'bad':v>=TH.w?'warn':'ok',stT={ok:'SECURE',warn:'WARNING',bad:'CRITICAL'},stN={ok:'Healthy',warn:'Warning',bad:'Critical'},risk=v=>Math.min(99,Math.round(v/TH.c*72));
const raw=[['S01','Front-Right Suspension','Suspension','KBX 482A',1.6,'FR',92,-58,'1.4.2'],['S02','Rear-Left Axle Mount','Chassis','KBX 482A',1.9,'RL',78,-64,'1.4.2'],['S03','Rear-Right Axle Mount','Chassis','KBX 482A',2.3,'RR',81,-66,'1.4.2'],['S04','Front-Left Suspension','Suspension','KBX 482A',2.2,'FL',87,-61,'1.4.1'],['S05','Engine Mount Left','Engine','KBX 482A',1.4,'',95,-55,'1.4.2'],['S06','Front Brake Caliper','Brakes','KBX 482A',1.2,'',66,-70,'1.4.0'],['S07','Steering Rack Mount','Steering','KCD 117T',1.7,'FL',90,-60,'1.4.2'],['S08','Transmission Mount','Transmission','KCD 117T',2,'FR',73,-68,'1.4.2'],['S09','Rear Subframe','Chassis','KCD 117T',1.5,'RL',84,-63,'1.4.2'],['S10','Front Wheel Hub','Wheels','KDG 904M',1.8,'FL',88,-59,'1.4.2'],['S11','Engine Mount Right','Engine','KDG 904M',1.5,'RR',18,-77,'1.3.9'],['S12','Rear Suspension','Suspension','KDG 904M',2.1,'RL',79,-65,'1.4.2']];

let A=[{id:'A-104',sev:'warn',title:'VIBRATION ABOVE WARNING THRESHOLD',sensor:'BG-S04',vib:4.8,risk:46,time:clk(40),status:'Active'},{id:'A-103',sev:'ok',title:'SENSOR COMMUNICATION LOST',sensor:'BG-S11',vib:0,risk:5,time:clk(900),status:'Resolved'},{id:'A-102',sev:'warn',title:'INCREASING VIBRATION TREND',sensor:'BG-S07',vib:4.6,risk:40,time:clk(3000),status:'Resolved'}];

function ev(id,m,l){E.unshift({T,t:clk(0),id,m,l});E.length=Math.min(E.length,40)}

 else{if(l=='bad'&&ex.sev!='bad'){ex.sev='bad';ex.title='CRITICAL STRUCTURAL LOOSENESS';ev(s.id,'Critical vibration detected','bad');flag=1}if(v>ex.vib){ex.vib=v;ex.risk=risk(v)}}}

const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const sOpts=(v,none)=>(none?`<option value="">None</option>`:'')+sens.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${s.id} · ${s.loc}</option>`).join('');

 for(const k in P){const s=ss.find(x=>x.z===k),[x,y,d]=P[k],c=s?`var(--${st(cur(s))})`:'var(--mute)',a=d<0?'end':'start',lx=x+d*16;
  o+=`<circle cx="${x}" cy="${y}" r="9" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="4" fill="${c}"/><text x="${lx}" y="${y-1}" text-anchor="${a}">${k}</text><text class="mute" x="${lx}" y="${y+10}" text-anchor="${a}">${s?stT[st(cur(s))]:'N/A'}</text>`}

 const W=r.width,H=r.height,L=30,B=20,Y=v=>H-B-v/15*(H-B-6),X=t=>L+t*(W-L),cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim();g.font='11px Barlow,sans-serif';

 for(let i=0;i<5;i++){g.fillStyle=col('--mute');g.fillText(new Date(Date.now()-n*1000*(1-i/4)).toLocaleTimeString('en-GB').slice(n<=300?0:0,n<=300?8:5),X(i/4)-(i==4?36:i?16:0),H-4)}

const MD=(()=>{const E=[],box=(x0,x1,y0,y1,z0,z1)=>{const p=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>E.push([p[a],p[b]]))};
 box(-.95,.95,.3,.8,-2.2,2.2);const b=[[-.85,.8,-1.1],[.85,.8,-1.1],[.85,.8,.9],[-.85,.8,.9]],t=[[-.7,1.3,-.8],[.7,1.3,-.8],[.7,1.3,.5],[-.7,1.3,.5]];
 for(let i=0;i<4;i++)E.push([b[i],b[(i+1)%4]],[t[i],t[(i+1)%4]],[b[i],t[i]]);
 [[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]].forEach(([sx,z])=>{const x=sx*.98;for(let i=0;i<14;i++){const a=i/14*TWO,c=(i+1)/14*TWO;E.push([[x,.38+Math.sin(a)*.38,z+Math.cos(a)*.38],[x,.38+Math.sin(c)*.38,z+Math.cos(c)*.38]]);if(i%2==0)E.push([[x,.38,z],[x,.38+Math.sin(a)*.38,z+Math.cos(a)*.38]])}});
 E.push([[-.95,.55,.4],[.95,.55,.4]],[[-.95,.55,-.6],[.95,.55,-.6]]);return E})();
const PZ={FL:[-.95,.55,1.4],FR:[.95,.55,1.4],RL:[-.95,.55,-1.4],RR:[.95,.55,-1.4]},PC={Engine:[0,.8,1.7],Brakes:[-.9,.35,1],Transmission:[0,.4,.2],Steering:[.3,.9,1.2],Chassis:[0,.4,-.4],Suspension:[0,.3,0],Wheels:[0,.4,1.4]},pos=s=>PZ[s.z]||PC[s.comp]||[0,.5,0];
function draw3d(c,o={}){const r=c.getBoundingClientRect(),d=devicePixelRatio||1,W=r.width,H=r.height;if(c.width!==Math.round(W*d)||c.height!==Math.round(H*d)){c.width=Math.round(W*d);c.height=Math.round(H*d)}
 const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim(),ac=o.hud?'#4cc7ff':col('--acc'),t=performance.now()/1000,sc=o.sc||Math.min(W/7.5,H/4.2),cy=Math.cos(Q.yaw),sy=Math.sin(Q.yaw),cp=Math.cos(Q.pit),sp=Math.sin(Q.pit),
 P=([x,y,z])=>{const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y-.7,Y2=Y*cp+Z*sp,Z2=-Y*sp+Z*cp,k=9/(9+Z2);return[W/2+X*k*sc,H/2+Y2*0-Y2*k*sc,k]};
 g.strokeStyle=ac;g.lineWidth=1;
 if(!o.nf)[[3.1,.35,[]],[2.7,.2,[6,8]]].forEach(([R,al,dash],j)=>{g.globalAlpha=al;g.setLineDash(dash);g.lineDashOffset=-t*20*j;g.beginPath();for(let i=0;i<=64;i++){const a=i/64*TWO,p=P([Math.cos(a)*R,0,Math.sin(a)*R]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke()});
 g.setLineDash([]);g.globalAlpha=o.scan?.8:.3;const sy2=((t*.6)%1)*1.5,sq=[[-1.3,sy2,-2.5],[1.3,sy2,-2.5],[1.3,sy2,2.5],[-1.3,sy2,2.5],[-1.3,sy2,-2.5]];g.beginPath();sq.forEach((q,i)=>{const p=P(q);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.stroke();
 g.globalAlpha=.85;g.lineWidth=1.3;g.shadowColor=ac;g.shadowBlur=o.hud?10:5;g.beginPath();MD.forEach(([a,b])=>{const p=P(a),q=P(b);g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1])});g.stroke();g.shadowBlur=0;
 const hits=[];sens.filter(s=>s.veh===S.veh).forEach(s=>{const p=P(pos(s)),l=st(cur(s)),cc=col('--'+l),pu=(Math.sin(t*3+s.i)+1)/2,top=S.ai&&S.ai.top===s.id;
  g.globalAlpha=.25;g.fillStyle=cc;g.beginPath();g.arc(p[0],p[1],(9+pu*5)*p[2],0,TWO);g.fill();g.globalAlpha=1;g.beginPath();g.arc(p[0],p[1],4.5*p[2],0,TWO);g.fill();
  if(top){g.strokeStyle=cc;g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],(14+((t*20)%16))*p[2],0,TWO);g.stroke()}
  if(!o.nl){g.fillStyle=col('--ink');g.font='600 11px Barlow,sans-serif';g.fillText(s.id.slice(3)+' '+f(cur(s)),p[0]+9,p[1]-9)}hits.push({id:s.id,x:p[0],y:p[1]})});

const STEPS=['Calibrating sensor array','Streaming vibration channels','Computing baseline deviation','Running anomaly model','Correlating fastener signatures','Estimating looseness and torque','Compiling assessment'];

 [[1,2,1,[40,18],.5,.9],[1.12,1,1,[3,9],-.3,.6],[1.25,3,.7,[],.8,.7],[.88,1,1,[12,6,2,6],-.9,.5]].forEach(([k,w,a,dash,sp,al])=>{g.save();g.rotate(t*sp);g.globalAlpha=al;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.arc(0,0,R*k,0,TWO*a);g.stroke();g.restore()});
 g.globalAlpha=.5;g.lineWidth=1;for(let i=0;i<72;i++){const a=i/72*TWO+t*.1,l=i%6?6:14,r0=R*1.38;g.beginPath();g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);g.lineTo(Math.cos(a)*(r0+l),Math.sin(a)*(r0+l));g.stroke()}
 g.globalAlpha=1;g.lineWidth=6;g.strokeStyle='#19d57f';g.beginPath();g.arc(0,0,R*1.5,-Math.PI/2,-Math.PI/2+p*TWO);g.stroke();
 const a=t*2;g.globalAlpha=.22;g.fillStyle=c;g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a,a+.5);g.fill();g.restore();

function jarvis(now){const t=(now-S.aiRun)/1000,p=Math.min(1,Math.max(0,t/7)),c=$('#jc');draw3d(c,{hud:1,nf:1,nl:1,scan:1,sc:Math.min(innerWidth,innerHeight)*.092});

function loop(now){if(!Q.drag)Q.yaw+=S.aiRun?.012:.004;const c=$('#c3d');if(c&&!S.aiRun)draw3d(c);if(S.aiRun)jarvis(now);requestAnimationFrame(loop)}
document.addEventListener('pointerdown',e=>{if(e.target.id==='c3d')Q.drag={x:e.clientX,y:e.clientY,m:0}});

/* slide panels */
function panels(l){const e=$('#sl');e.innerHTML=l.map((h,i)=>`<div class="sp3" style="transition-delay:${i*130}ms">${h}</div>`).join('');document.body.classList.add('pan');requestAnimationFrame(()=>requestAnimationFrame(()=>e.querySelectorAll('.sp3').forEach(x=>x.classList.add('in'))))}
